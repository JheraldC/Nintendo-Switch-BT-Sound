name: Instalador portable
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python instalar.py --smoke-test
      - run: python tools/ci_portable_check.py
  fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - run: dnf install -y git python3 python3-pillow
      - uses: actions/checkout@v4
      - run: python3 instalar.py --smoke-test
      - run: python3 tools/ci_portable_check.py
