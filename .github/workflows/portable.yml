name: Instalador portable
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python instalar.py --smoke-test
      - run: python tools/ci_portable_check.py
      - name: Probar lanzador Windows con Python portable
        if: runner.os == 'Windows'
        run: |
          $result = & ([scriptblock]::Create((Get-Content -Raw install.ps1))) -CheckOnly
          $result | Write-Output
          if (($result | Out-String) -notmatch [regex]::Escape((Get-Content VERSION).Trim())) { throw 'Launcher version differs from this release' }
      - name: Probar lanzador Unix con Python portable
        if: runner.os != 'Windows'
        run: sh install.sh --smoke-test | tee launcher.log && grep -F "$(cat VERSION)" launcher.log
  fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - run: dnf install -y git python3 python3-pillow curl tar gzip coreutils
      - uses: actions/checkout@v4
      - run: python3 instalar.py --smoke-test
      - run: python3 tools/ci_portable_check.py
      - run: sh install.sh --smoke-test | tee launcher.log && grep -F "$(cat VERSION)" launcher.log
